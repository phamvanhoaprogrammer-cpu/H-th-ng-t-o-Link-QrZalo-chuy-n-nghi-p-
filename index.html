<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- Khóa Zoom viewport trên thiết bị di động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Hệ Thống Tạo Mã QR & Link Zalo - Phạm Văn Hoà Programmer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
        
        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            overflow-y: auto;
            min-height: 100vh;
            min-height: 100dvh;
            overscroll-behavior-y: none;
        }

        .anti-capture-layer {
            transition: filter 0.15s ease, opacity 0.15s ease;
            will-change: filter, opacity;
        }
        body.security-triggered .anti-capture-layer {
            filter: blur(50px) brightness(0%) !important;
            opacity: 0 !important;
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .glass-dark {
            background: rgba(5, 7, 15, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-modal {
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 bg-slate-950 text-slate-100 transition-colors duration-200">

    <!-- Khung chính bảo mật -->
    <div id="mainContainer" class="w-full max-w-sm sm:max-w-md my-auto rounded-3xl overflow-hidden relative anti-capture-layer glass-dark">
        
        <!-- Nút Đổi Giao Diện Sáng / Tối -->
        <button 
            onclick="toggleTheme()" 
            id="themeToggleBtn"
            class="absolute top-3.5 right-3.5 z-20 w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-600/50 text-white flex items-center justify-center transition-all active:scale-95 cursor-pointer shadow-md"
            title="Đổi giao diện Sáng/Tối"
        >
            <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
        </button>

        <!-- Header -->
        <div 
            onclick="window.location.reload()" 
            class="bg-gradient-to-r from-blue-700 via-indigo-700 to-violet-700 p-5 text-white text-center cursor-pointer relative overflow-hidden border-b border-white/20"
        >
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-2xl mb-2 backdrop-blur-md border border-white/30 shadow-inner">
                <i data-lucide="qr-code" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">
                Tạo Link & Mã QR Zalo
            </h1>
            <p class="text-blue-100 text-xs mt-0.5 font-bold opacity-90">Hệ thống bảo mật số điện thoại chuyên nghiệp</p>
        </div>

        <div class="p-4 sm:p-5 space-y-4">
            
            <!-- Toast Thông Báo -->
            <div id="successToast" class="hidden bg-emerald-600 text-white rounded-2xl p-3 flex items-center gap-3 shadow-xl">
                <div class="w-7 h-7 rounded-xl bg-white/20 flex items-center justify-center shrink-0">
                    <i data-lucide="check" class="w-4 h-4 text-white"></i>
                </div>
                <div class="flex-1">
                    <span id="successToastText" class="text-xs font-extrabold"></span>
                </div>
            </div>

            <!-- Form Nhập Số Điện Thoại -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between ml-1 mr-1">
                    <label for="phoneInput" id="labelPhone" class="block text-xs sm:text-sm font-extrabold text-slate-200">
                        Số điện thoại Zalo (Việt Nam)
                    </label>
                    <span id="charCounter" class="text-[11px] font-extrabold text-slate-400">0/10 số</span>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div id="inputWrapper" class="relative rounded-2xl flex items-center flex-1 bg-slate-900 border border-slate-700 focus-within:border-blue-500 transition-all overflow-hidden shadow-inner">
                        <div id="phonePrefix" class="pl-3.5 pr-3 py-3.5 flex items-center gap-1.5 text-slate-200 text-xs sm:text-sm font-extrabold border-r border-slate-700 bg-slate-800/80 shrink-0">
                            <span>🇻🇳 +84</span>
                        </div>

                        <input 
                            type="tel" 
                            id="phoneInput"
                            placeholder="Nhập 10 số..." 
                            maxlength="10"
                            oninput="handlePhoneInput(this)"
                            class="block w-full px-3.5 py-3.5 bg-transparent text-white text-base sm:text-lg font-black tracking-widest focus:outline-none placeholder:text-slate-500 placeholder:text-xs placeholder:font-normal placeholder:tracking-normal"
                        />

                        <!-- Nút Xóa Nhanh (Dấu X đỏ) -->
                        <button 
                            type="button"
                            id="clearInputBtn"
                            onclick="clearPhoneInput()"
                            class="hidden mr-2.5 w-6 h-6 rounded-full bg-rose-500/20 hover:bg-rose-500/30 text-rose-500 flex items-center justify-center transition-all cursor-pointer shrink-0"
                            title="Xóa nội dung"
                        >
                            <i data-lucide="x" class="w-3.5 h-3.5 stroke-[3]"></i>
                        </button>
                    </div>

                    <!-- Nút Sao Chép Cạnh Ô Nhập Liệu -->
                    <button 
                        type="button"
                        id="inlineCopyBtn"
                        onclick="copyInputPhone()"
                        class="px-3.5 py-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-blue-400 font-extrabold rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 shadow-md cursor-pointer"
                        title="Sao chép số điện thoại"
                    >
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Nút Tạo -->
            <button 
                onclick="processGenerator()" 
                class="w-full inline-flex items-center justify-center gap-2 px-4 py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-extrabold text-xs sm:text-sm rounded-2xl transition-all shadow-lg shadow-emerald-900/50 cursor-pointer"
            >
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                Tạo Link & Mã QR Zalo
            </button>

            <!-- Kết Quả -->
            <div id="resultSection" class="space-y-3.5 hidden pt-1">
                
                <!-- Phần 1: Link -->
                <div id="panelBox1" class="bg-slate-900/90 p-3.5 rounded-2xl space-y-2 border border-slate-800 shadow-md">
                    <div id="titlePart1" class="flex items-center gap-2 text-blue-400 font-extrabold text-xs">
                        <i data-lucide="link" class="w-4 h-4"></i>
                        <span>Phần 1: Đường Link Zalo</span>
                    </div>
                    
                    <input 
                        type="text" 
                        id="zaloUrl" 
                        readonly 
                        class="block w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-xs font-mono font-bold focus:outline-none"
                    />

                    <div class="grid grid-cols-2 gap-2">
                        <button 
                            id="copyBtn"
                            onclick="copyLink()" 
                            class="inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-blue-400 font-extrabold text-xs rounded-xl transition-all border border-slate-700 active:scale-95 cursor-pointer"
                        >
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span id="copyBtnText">Sao chép link</span>
                        </button>
                        
                        <a 
                            id="openZaloBtn"
                            href="#" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-md active:scale-95"
                        >
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            <span>Mở Zalo</span>
                        </a>
                    </div>
                </div>

                <!-- Phần 2: QR -->
                <div id="panelBox2" class="bg-slate-900/90 p-3.5 rounded-2xl space-y-2.5 flex flex-col items-center border border-slate-800 shadow-md">
                    <div id="titlePart2" class="w-full flex items-center gap-2 text-indigo-400 font-extrabold text-xs">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                        <span>Phần 2: Mã QR Zalo</span>
                    </div>

                    <div id="qrcode" class="p-2.5 bg-white rounded-2xl shadow-inner border border-slate-300 flex items-center justify-center overflow-hidden"></div>
                    <p id="qrDesc" class="text-[11px] font-extrabold text-slate-400">Mã QR bảo mật độc quyền</p>

                    <button 
                        id="downloadBtn"
                        onclick="downloadQR()" 
                        class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-xs rounded-xl transition-all active:scale-[0.98] cursor-pointer border border-slate-700"
                    >
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Tải mã QR về máy
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footerBox" class="bg-slate-900/80 border-t border-slate-800 p-2.5 text-center space-y-0.5">
            <p id="footerText" class="text-[11px] font-extrabold text-slate-300">
                Phát triển bởi: <span class="text-blue-400">Phạm Văn Hoà Programmer 🇻🇳</span>
            </p>
        </div>
    </div>

    <!-- Popup Modal Thông Báo / Chặn Truy Cập PC -->
    <div id="errorModal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xs sm:max-w-sm w-full p-6 text-center shadow-2xl animate-modal">
            <div id="modalIconContainer" class="w-12 h-12 bg-rose-500/20 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i id="modalIcon" data-lucide="shield-alert" class="w-6 h-6"></i>
            </div>
            <h3 id="modalTitle" class="text-base sm:text-lg font-extrabold text-white mb-1">Cảnh Báo Bảo Mật</h3>
            <p id="modalMessage" class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed font-bold"></p>
            <button 
                id="modalActionBtn"
                onclick="closeModal()" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs sm:text-sm rounded-xl transition-all shadow-lg active:scale-95 cursor-pointer"
            >
                Đã hiểu
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ==========================================
        // 1. CHẶN VĨNH VIỄN MÁY TÍNH / PC / LAPTOP
        // ==========================================
        function enforceMobileOnly() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 768);
            if (!isMobile) {
                showModal(
                    "Hệ thống từ chối truy cập từ Máy tính (PC/Laptop). Vui lòng sử dụng Điện thoại di động để truy cập ứng dụng!", 
                    "Truy Cập Bị Từ Chối", 
                    true
                );
            }
        }

        document.addEventListener('DOMContentLoaded', enforceMobileOnly);
        
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                enforceMobileOnly();
            }, 250);
        });

        // ==========================================
        // 2. KHÓA HOÀN TOÀN ZOOM & PHÍM TẮT CHỤP MÀN HÌNH
        // ==========================================
        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
            document.addEventListener(type, e => e.preventDefault());
        });

        document.addEventListener('keydown', function (e) {
            if (
                e.keyCode === 123 || 
                e.keyCode === 44 ||  
                (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || 
                (e.ctrlKey && [85, 83, 80, 67].includes(e.keyCode))
            ) {
                e.preventDefault();
                triggerSecurityWarning("Phát hiện hành vi sao chép hoặc chụp màn hình! Dữ liệu đã bị vô hiệu hóa.");
                return false;
            }
        });

        // ==========================================
        // 3. NHẬN DIỆN CHỤP MÀN HÌNH / ẨN TAB
        // ==========================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.body.classList.add('security-triggered');
                triggerSecurityWarning("Hệ thống phát hiện bạn rời khỏi trang hoặc cố gắng chụp ảnh màn hình!");
            } else {
                document.body.classList.remove('security-triggered');
            }
        });

        window.addEventListener('blur', () => {
            document.body.classList.add('security-triggered');
        });

        window.addEventListener('focus', () => {
            document.body.classList.remove('security-triggered');
        });

        function triggerSecurityWarning(msg) {
            showModal(msg, "Cảnh Báo An Ninh");
        }

        // ==========================================
        // 4. CHẾ ĐỘ SÁNG / TỐI (LIGHT / DARK MODE)
        // ==========================================
        function toggleTheme() {
            const html = document.documentElement;
            const container = document.getElementById('mainContainer');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const labelPhone = document.getElementById('labelPhone');
            const charCounter = document.getElementById('charCounter');
            const inputWrapper = document.getElementById('inputWrapper');
            const phonePrefix = document.getElementById('phonePrefix');
            const phoneInput = document.getElementById('phoneInput');
            const inlineCopyBtn = document.getElementById('inlineCopyBtn');
            const box1 = document.getElementById('panelBox1');
            const titlePart1 = document.getElementById('titlePart1');
            const zaloUrl = document.getElementById('zaloUrl');
            const copyBtn = document.getElementById('copyBtn');
            const box2 = document.getElementById('panelBox2');
            const titlePart2 = document.getElementById('titlePart2');
            const qrDesc = document.getElementById('qrDesc');
            const downloadBtn = document.getElementById('downloadBtn');
            const footerBox = document.getElementById('footerBox');
            const footerText = document.getElementById('footerText');
            const icon = document.getElementById('themeIcon');

            if (html.classList.contains('dark')) {
                // Light Mode
                html.classList.remove('dark');
                container.className = "w-full max-w-sm sm:max-w-md my-auto rounded-3xl overflow-hidden relative anti-capture-layer glass-light text-slate-900 bg-white";
                themeToggleBtn.className = "absolute top-3.5 right-3.5 z-20 w-9 h-9 rounded-xl bg-slate-200 hover:bg-slate-300 border border-slate-300 text-slate-800 flex items-center justify-center transition-all active:scale-95 cursor-pointer shadow-md";
                
                labelPhone.className = "block text-xs sm:text-sm font-extrabold text-slate-900";
                charCounter.className = "text-[11px] font-extrabold text-slate-500";
                inputWrapper.className = "relative rounded-2xl flex items-center flex-1 bg-slate-100 border border-slate-300 focus-within:border-blue-600 transition-all overflow-hidden shadow-inner";
                phonePrefix.className = "pl-3.5 pr-3 py-3.5 flex items-center gap-1.5 text-slate-900 text-xs sm:text-sm font-extrabold border-r border-slate-300 bg-slate-200/80 shrink-0";
                phoneInput.className = "block w-full px-3.5 py-3.5 bg-transparent text-slate-900 text-base sm:text-lg font-black tracking-widest focus:outline-none placeholder:text-slate-400 placeholder:text-xs placeholder:font-normal placeholder:tracking-normal";
                inlineCopyBtn.className = "px-3.5 py-3.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-blue-700 font-extrabold rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 shadow-md cursor-pointer";

                if(box1) box1.className = "bg-slate-100 p-3.5 rounded-2xl space-y-2 border border-slate-300 shadow-md";
                if(titlePart1) titlePart1.className = "flex items-center gap-2 text-blue-700 font-extrabold text-xs";
                if(zaloUrl) zaloUrl.className = "block w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-900 text-xs font-mono font-bold focus:outline-none";
                if(copyBtn) copyBtn.className = "inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-white hover:bg-slate-50 text-blue-700 font-extrabold text-xs rounded-xl transition-all border border-slate-300 active:scale-95 cursor-pointer shadow-sm";

                if(box2) box2.className = "bg-slate-100 p-3.5 rounded-2xl space-y-2.5 flex flex-col items-center border border-slate-300 shadow-md";
                if(titlePart2) titlePart2.className = "w-full flex items-center gap-2 text-indigo-700 font-extrabold text-xs";
                if(qrDesc) qrDesc.className = "text-[11px] font-extrabold text-slate-700";
                if(downloadBtn) downloadBtn.className = "w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs rounded-xl transition-all active:scale-[0.98] cursor-pointer shadow-sm";

                if(footerBox) footerBox.className = "bg-slate-100 border-t border-slate-300 p-2.5 text-center space-y-0.5";
                if(footerText) footerText.className = "text-[11px] font-extrabold text-slate-800";

                icon.setAttribute('data-lucide', 'moon');
            } else {
                // Dark Mode
                html.classList.add('dark');
                container.className = "w-full max-w-sm sm:max-w-md my-auto rounded-3xl overflow-hidden relative anti-capture-layer glass-dark text-slate-100";
                themeToggleBtn.className = "absolute top-3.5 right-3.5 z-20 w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-600/50 text-white flex items-center justify-center transition-all active:scale-95 cursor-pointer shadow-md";
                
                labelPhone.className = "block text-xs sm:text-sm font-extrabold text-slate-200";
                charCounter.className = "text-[11px] font-extrabold text-slate-400";
                inputWrapper.className = "relative rounded-2xl flex items-center flex-1 bg-slate-900 border border-slate-700 focus-within:border-blue-500 transition-all overflow-hidden shadow-inner";
                phonePrefix.className = "pl-3.5 pr-3 py-3.5 flex items-center gap-1.5 text-slate-200 text-xs sm:text-sm font-extrabold border-r border-slate-700 bg-slate-800/80 shrink-0";
                phoneInput.className = "block w-full px-3.5 py-3.5 bg-transparent text-white text-base sm:text-lg font-black tracking-widest focus:outline-none placeholder:text-slate-500 placeholder:text-xs placeholder:font-normal placeholder:tracking-normal";
                inlineCopyBtn.className = "px-3.5 py-3.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-blue-400 font-extrabold rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 shadow-md cursor-pointer";

                if(box1) box1.className = "bg-slate-900/90 p-3.5 rounded-2xl space-y-2 border border-slate-800 shadow-md";
                if(titlePart1) titlePart1.className = "flex items-center gap-2 text-blue-400 font-extrabold text-xs";
                if(zaloUrl) zaloUrl.className = "block w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 text-xs font-mono font-bold focus:outline-none";
                if(copyBtn) copyBtn.className = "inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-blue-400 font-extrabold text-xs rounded-xl transition-all border border-slate-700 active:scale-95 cursor-pointer";

                if(box2) box2.className = "bg-slate-900/90 p-3.5 rounded-2xl space-y-2.5 flex flex-col items-center border border-slate-800 shadow-md";
                if(titlePart2) titlePart2.className = "w-full flex items-center gap-2 text-indigo-400 font-extrabold text-xs";
                if(qrDesc) qrDesc.className = "text-[11px] font-extrabold text-slate-400";
                if(downloadBtn) downloadBtn.className = "w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-xs rounded-xl transition-all active:scale-[0.98] cursor-pointer border border-slate-700";

                if(footerBox) footerBox.className = "bg-slate-900/80 border-t border-slate-800 p-2.5 text-center space-y-0.5";
                if(footerText) footerText.className = "text-[11px] font-extrabold text-slate-300";

                icon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        // ==========================================
        // 5. XỬ LÝ NHẬP LIỆU & GIỚI HẠN 10 SỐ
        // ==========================================
        function handlePhoneInput(input) {
            // Lọc chỉ lấy ký tự số và giới hạn cứng tối đa 10 số
            let cleaned = input.value.replace(/\D/g, '');
            if (cleaned.length > 10) {
                cleaned = cleaned.slice(0, 10);
            }
            input.value = cleaned;

            // Cập nhật bộ đếm ký tự
            document.getElementById('charCounter').innerText = `${cleaned.length}/10 số`;

            // Hiện / ẩn nút xóa (dấu X đỏ)
            const clearBtn = document.getElementById('clearInputBtn');
            if (cleaned.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function clearPhoneInput() {
            const input = document.getElementById('phoneInput');
            input.value = '';
            handlePhoneInput(input);
            input.focus();
        }

        function copyInputPhone() {
            const input = document.getElementById('phoneInput');
            const val = input.value.trim();
            if (!val) {
                showModal("Chưa có số điện thoại để sao chép!");
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                showToast(`Đã sao chép: ${val}`);
            });
        }

        function processGenerator() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 768);
            if (!isMobile) {
                showModal("Tính năng này bị khóa trên PC!", "Hạn chế", true);
                return;
            }

            const input = document.getElementById('phoneInput');
            const resultSection = document.getElementById('resultSection');
            const zaloUrlInput = document.getElementById('zaloUrl');
            const openZaloBtn = document.getElementById('openZaloBtn');

            let cleanDigits = input.value.trim();

            if (cleanDigits.length !== 10) {
                showModal(`Vui lòng nhập đúng đủ 10 chữ số (hiện tại có ${cleanDigits.length} số).`);
                resultSection.classList.add('hidden');
                return;
            }

            // Nếu người dùng lỡ nhập bắt đầu bằng số 84 hoặc khác, chuẩn hóa thành 0 đầu tiên nếu cần hoặc giữ nguyên 10 số di động Việt Nam chuẩn
            if (cleanDigits.startsWith('84')) {
                cleanDigits = '0' + cleanDigits.slice(2);
            } else if (!cleanDigits.startsWith('0')) {
                cleanDigits = '0' + cleanDigits.slice(1);
            }

            const zaloLink = `https://zalo.me/${cleanDigits}`;
            zaloUrlInput.value = zaloLink;
            openZaloBtn.href = zaloLink;

            generateQRCode(zaloLink);
            resultSection.classList.remove('hidden');
            showToast(`Tạo thành công Zalo: ${cleanDigits}`);
        }

        function generateQRCode(text) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: text,
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            const qrImg = document.querySelector('#qrcode img');

            let imageURL = "";
            if (qrCanvas) {
                imageURL = qrCanvas.toDataURL("image/png");
            } else if (qrImg) {
                imageURL = qrImg.src;
            }

            if (imageURL) {
                const link = document.createElement('a');
                link.href = imageURL;
                link.download = 'qr-zalo-baomat.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Đã tải mã QR về máy!");
            } else {
                showModal("Không tìm thấy dữ liệu mã QR để tải xuống!");
            }
        }

        function copyLink() {
            const zaloUrl = document.getElementById('zaloUrl');
            zaloUrl.select();
            navigator.clipboard.writeText(zaloUrl.value).then(() => {
                const btnText = document.getElementById('copyBtnText');
                btnText.innerText = "Đã chép!";
                setTimeout(() => btnText.innerText = "Sao chép link", 1500);
            });
        }

        function showModal(message, title = "Thông Báo", isBlocking = false) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('errorModal').classList.remove('hidden');
            const btn = document.getElementById('modalActionBtn');
            btn.style.display = isBlocking ? 'none' : 'block';
        }

        function closeModal() {
            document.getElementById('errorModal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('successToast');
            document.getElementById('successToastText').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
