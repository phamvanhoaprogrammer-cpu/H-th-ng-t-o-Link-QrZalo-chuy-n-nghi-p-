<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Khóa Zoom viewport triệt để trên mọi trình duyệt mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Hệ Thống Tạo Mã QR & Link Zalo - Phạm Văn Hoà Programmer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            /* Tắt thao tác phóng to cảm ứng trên di động */
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            /* Vô hiệu hóa bôi đen chống copy giao diện */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Animation Popup & Toast */
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-modal {
            animation: modalFadeIn 0.2s ease-out forwards;
        }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-toast {
            animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-sm sm:max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden relative transition-all">
        
        <!-- Header (Bấm vào tiêu đề để reset trang) -->
        <div 
            onclick="window.location.reload()" 
            class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 sm:p-6 text-white text-center cursor-pointer hover:opacity-95 transition-opacity"
            title="Bấm để làm mới trang"
        >
            <div class="inline-flex items-center justify-center w-11 h-11 sm:w-12 sm:h-12 bg-white/10 rounded-xl mb-2 sm:mb-3 backdrop-blur-sm">
                <i data-lucide="qr-code" class="w-5 h-5 sm:w-6 sm:h-6 text-white"></i>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight active:scale-95 transition-transform inline-block">
                Tạo Link & Mã QR Zalo
            </h1>
            <p class="text-blue-100 text-xs sm:text-sm mt-0.5">Công cụ chuyển đổi số điện thoại chuyên nghiệp</p>
        </div>

        <div class="p-4 sm:p-6 space-y-4 sm:space-y-5">
            
            <!-- Toast Thông báo thành công -->
            <div id="successToast" class="hidden animate-toast bg-emerald-50 border border-emerald-200/80 rounded-xl p-3 flex items-center justify-center gap-2 text-slate-900 shadow-sm">
                <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>
                <span id="successToastText" class="text-xs sm:text-sm font-bold"></span>
            </div>

            <!-- Form Input -->
            <div>
                <label for="phoneInput" class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                    Số điện thoại Zalo (Việt Nam)
                </label>
                
                <!-- Input Group: Icon + Flag + Input thẳng hàng -->
                <div class="relative rounded-xl shadow-sm flex items-center bg-slate-50 border border-slate-200 focus-within:ring-2 focus-within:ring-blue-500 focus-within:bg-white focus-within:border-transparent transition-all overflow-hidden">
                    
                    <!-- Prefixes Thẳng Hàng -->
                    <div class="pl-3 pr-2.5 py-3 flex items-center gap-1.5 text-slate-600 text-xs sm:text-sm font-medium border-r border-slate-200 bg-slate-100/60 shrink-0 select-none">
                        <i data-lucide="phone" class="w-4 h-4 text-slate-500 shrink-0"></i>
                        <span class="flex items-center gap-1 leading-none font-semibold">🇻🇳 +84</span>
                    </div>

                    <!-- Input -->
                    <input 
                        type="tel" 
                        id="phoneInput"
                        placeholder="869719516 hoặc 0869719516" 
                        maxlength="13"
                        class="block w-full px-3 py-3 bg-transparent text-slate-800 text-xs sm:text-sm font-medium focus:outline-none placeholder:text-slate-400"
                    />
                </div>
            </div>

            <!-- Green Generate Button -->
            <button 
                onclick="processGenerator()" 
                class="w-full inline-flex items-center justify-center gap-2 px-4 py-3 sm:py-3.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md shadow-emerald-600/20 active:scale-[0.98]"
            >
                <i data-lucide="sparkles" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                Tạo Link & Mã QR Zalo
            </button>

            <!-- Result Section -->
            <div id="resultSection" class="space-y-4 sm:space-y-5 hidden pt-1">
                
                <!-- Phần 1: Tạo Link Zalo -->
                <div class="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200/80 space-y-2.5 sm:space-y-3">
                    <div class="flex items-center gap-2 text-blue-600 font-bold text-xs sm:text-sm">
                        <i data-lucide="link" class="w-4 h-4"></i>
                        <span>Phần 1: Đường Link Zalo</span>
                    </div>
                    
                    <input 
                        type="text" 
                        id="zaloUrl" 
                        readonly 
                        class="block w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-700 text-xs sm:text-sm font-mono focus:outline-none"
                    />

                    <div class="grid grid-cols-2 gap-2">
                        <button 
                            onclick="copyLink()" 
                            class="inline-flex items-center justify-center gap-1.5 px-2.5 py-2 sm:py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold text-xs sm:text-sm rounded-lg transition-colors active:scale-95"
                        >
                            <i data-lucide="copy" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                            <span id="copyBtnText">Sao chép</span>
                        </button>
                        
                        <a 
                            id="openZaloBtn"
                            href="#" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="inline-flex items-center justify-center gap-1.5 px-2.5 py-2 sm:py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-lg transition-colors active:scale-95"
                        >
                            <i data-lucide="external-link" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                            <span>Mở Zalo</span>
                        </a>
                    </div>
                </div>

                <!-- Phần 2: Tạo Mã QR Zalo -->
                <div class="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200/80 space-y-3 flex flex-col items-center">
                    <div class="w-full flex items-center gap-2 text-indigo-600 font-bold text-xs sm:text-sm mb-0.5">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                        <span>Phần 2: Mã QR Zalo</span>
                    </div>

                    <div id="qrcode" class="p-2.5 bg-white rounded-lg shadow-sm border border-slate-200"></div>
                    <p class="text-[11px] text-slate-400">Mã QR chuẩn (Đen / Nền Trắng)</p>

                    <button 
                        onclick="downloadQR()" 
                        class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs sm:text-sm rounded-xl transition-all shadow-sm active:scale-[0.98]"
                    >
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Tải mã QR về máy
                    </button>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 border-t border-slate-100 p-3.5 text-center space-y-1">
            <p class="text-[11px] sm:text-xs font-semibold text-slate-600">
                Một sản phẩm của : <span class="text-blue-600">Phạm Văn Hoà Programmer 🇻🇳</span>
            </p>
            <p class="text-[11px] sm:text-xs font-semibold text-slate-500">
                📞 : <a href="https://zalo.me/0869719516" target="_blank" rel="noopener noreferrer" class="text-emerald-600 hover:text-emerald-700 hover:underline transition-colors font-bold">0869 719 516</a>
            </p>
        </div>
    </div>

    <!-- Popup Modal Báo Lỗi -->
    <div id="errorModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-xs sm:max-w-sm w-full p-5 sm:p-6 text-center shadow-2xl border border-slate-100 animate-modal">
            <div class="w-11 h-11 sm:w-12 sm:h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4">
                <i data-lucide="alert-triangle" class="w-5 h-5 sm:w-6 sm:h-6"></i>
            </div>
            <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-1.5">Thông Báo Hệ Thống</h3>
            <p id="modalMessage" class="text-slate-600 text-xs sm:text-sm mb-5 leading-relaxed"></p>
            <button 
                onclick="closeModal()" 
                class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs sm:text-sm rounded-xl transition-all active:scale-95"
            >
                Đã hiểu
            </button>
        </div>
    </div>

    <script>
        // Khởi tạo Lucide Icons
        lucide.createIcons();

        let qrcodeObj = null;

        // ==========================================
        // 1. TẮT VĨNH VIỄN ZOOM, DOUBLE-TAP VÀ PINCH-TO-ZOOM TRIỆT ĐỂ
        // ==========================================
        // Chặn Zoom 2 ngón tay (Pinch-to-zoom)
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchmove', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Chặn Double-Tap Zoom (Chạm 2 lần liên tiếp)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // Chặn Zoom Gesture trên Safari iOS
        document.addEventListener('gesturestart', function (event) {
            event.preventDefault();
        });
        document.addEventListener('gesturechange', function (event) {
            event.preventDefault();
        });
        document.addEventListener('gestureend', function (event) {
            event.preventDefault();
        });

        // Chặn Zoom bằng bàn phím & con cuộn chuột trên PC
        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey && (event.key === '+' || event.key === '-' || event.key === '=' || event.key === '0')) {
                event.preventDefault();
            }
        });
        document.addEventListener('wheel', function (event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });

        // ==========================================
        // 2. CHẶN F12 VÀ XEM MÃ NGUỒN (ANTI-INSPECT)
        // ==========================================
        // Chặn chuột phải
        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        });

        // Chặn phím F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+Shift+C
        document.addEventListener('keydown', function (event) {
            if (
                event.keyCode === 123 || // F12
                (event.ctrlKey && event.shiftKey && event.keyCode === 73) || // Ctrl+Shift+I
                (event.ctrlKey && event.shiftKey && event.keyCode === 74) || // Ctrl+Shift+J
                (event.ctrlKey && event.shiftKey && event.keyCode === 67) || // Ctrl+Shift+C
                (event.ctrlKey && event.keyCode === 85) // Ctrl+U
            ) {
                event.preventDefault();
                return false;
            }
        });

        // ==========================================
        // 3. LOGIC XỬ LÝ TẠO LINK & MÃ QR ZALO
        // ==========================================
        function processGenerator() {
            const input = document.getElementById('phoneInput');
            const resultSection = document.getElementById('resultSection');
            const zaloUrlInput = document.getElementById('zaloUrl');
            const openZaloBtn = document.getElementById('openZaloBtn');

            let rawValue = input.value.trim();

            if (!rawValue) {
                hideSuccessToast();
                showModal("Vui lòng nhập đầy đủ thông tin số điện thoại trước khi tạo!");
                resultSection.classList.add('hidden');
                return;
            }

            let cleanDigits = rawValue.replace(/\D/g, '');

            if (cleanDigits.startsWith('84')) {
                cleanDigits = '0' + cleanDigits.slice(2);
            } else if (!cleanDigits.startsWith('0')) {
                cleanDigits = '0' + cleanDigits;
            }

            const totalDigits = cleanDigits.length;

            if (totalDigits < 10) {
                hideSuccessToast();
                const missing = 10 - totalDigits;
                showModal(`Bạn đã nhập thiếu số! Hệ thống nhận diện ${totalDigits} số, còn thiếu ${missing} số. Vui lòng kiểm tra lại.`);
                resultSection.classList.add('hidden');
                return;
            } 

            if (totalDigits > 10) {
                hideSuccessToast();
                showModal(`Số điện thoại không hợp lệ! Đã vượt quá 10 số (hiện tại có ${totalDigits} số).`);
                resultSection.classList.add('hidden');
                return;
            }

            const zaloLink = `https://zalo.me/${cleanDigits}`;
            zaloUrlInput.value = zaloLink;
            openZaloBtn.href = zaloLink;

            generateQRCode(zaloLink);

            resultSection.classList.remove('hidden');
            showSuccessToast(`Đã tạo thành công Mã QR & Link Zalo cho số ${cleanDigits}!`);
        }

        function generateQRCode(text) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            qrcodeObj = new QRCode(qrContainer, {
                text: text,
                width: 170,
                height: 170,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function copyLink() {
            const zaloUrl = document.getElementById('zaloUrl');
            zaloUrl.select();
            zaloUrl.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(zaloUrl.value).then(() => {
                const copyBtnText = document.getElementById('copyBtnText');
                copyBtnText.innerText = "Đã sao chép!";
                setTimeout(() => {
                    copyBtnText.innerText = "Sao chép";
                }, 2000);
            });
        }

        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            const qrImg = document.querySelector('#qrcode img');

            let imageSrc = '';
            if (qrCanvas) {
                imageSrc = qrCanvas.toDataURL("image/png");
            } else if (qrImg) {
                imageSrc = qrImg.src;
            }

            if (imageSrc) {
                const link = document.createElement('a');
                link.href = imageSrc;
                link.download = 'ma-qr-zalo.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function showModal(message) {
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('errorModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('errorModal').classList.add('hidden');
        }

        function showSuccessToast(message) {
            const toast = document.getElementById('successToast');
            document.getElementById('successToastText').innerText = message;
            toast.classList.remove('hidden');
        }

        function hideSuccessToast() {
            document.getElementById('successToast').classList.add('hidden');
        }
    </script>
</body>
</html>
