<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Hệ Thống Tạo Mã QR & Link Zalo - Phạm Văn Hoà Programmer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Hiệu ứng kính bóng cao cấp (Glassmorphism) */
        .glass-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-modal {
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4 bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-950 dark:to-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

    <!-- Khung chính hiệu ứng kính bóng -->
    <div id="mainContainer" class="w-full max-w-sm sm:max-w-md my-auto rounded-3xl overflow-hidden relative glass-light dark:glass-dark transition-colors duration-200">
        
        <!-- Nút Đổi Giao Diện Sáng / Tối (Nổi bật, dễ nhìn) -->
        <button 
            type="button"
            onclick="toggleTheme()" 
            id="themeToggleBtn"
            class="absolute top-3 right-3 z-30 w-9 h-9 rounded-2xl bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-white flex items-center justify-center transition-all active:scale-95 cursor-pointer shadow-lg backdrop-blur-md"
            title="Đổi giao diện Sáng/Tối"
        >
            <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
        </button>

        <!-- Header -->
        <div 
            onclick="window.location.reload()" 
            class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 p-5 text-white text-center cursor-pointer relative overflow-hidden border-b border-white/10 shadow-md"
        >
            <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-2xl mb-2 backdrop-blur-md border border-white/40 shadow-inner">
                <i data-lucide="qr-code" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight">
                Tạo Link & Mã QR Zalo
            </h1>
            <p class="text-blue-100 text-[11px] sm:text-xs mt-0.5 font-bold opacity-90">Hệ thống tạo link số điện thoại nhanh chóng</p>
        </div>

        <div class="p-4 sm:p-5 space-y-4">
            
            <!-- Toast Thông Báo -->
            <div id="successToast" class="hidden bg-slate-900 dark:bg-white text-white dark:text-slate-900 border border-slate-800 dark:border-slate-200 rounded-2xl p-3 flex items-center gap-3 shadow-2xl transition-all">
                <div class="w-7 h-7 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">
                    <i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>
                </div>
                <div class="flex-1">
                    <span id="successToastText" class="text-xs font-extrabold"></span>
                </div>
            </div>

            <!-- Form Nhập Số Điện Thoại -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between px-1">
                    <label for="phoneInput" class="block text-xs font-extrabold text-slate-800 dark:text-slate-200">
                        Số điện thoại Zalo (Việt Nam)
                    </label>
                    <span id="charCounter" class="text-[11px] font-extrabold text-slate-600 dark:text-slate-400">0/10 số</span>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div class="relative rounded-2xl flex items-center flex-1 bg-white/80 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 focus-within:border-blue-600 dark:focus-within:border-blue-500 transition-all overflow-hidden shadow-inner backdrop-blur-sm">
                        <div class="pl-3 pr-2.5 py-3 flex items-center gap-1 text-slate-800 dark:text-slate-200 text-xs font-extrabold border-r border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/80 shrink-0">
                            <span>🇻🇳 +84</span>
                        </div>

                        <input 
                            type="tel" 
                            id="phoneInput"
                            placeholder="Nhập 10 số..." 
                            maxlength="10"
                            oninput="handlePhoneInput(this)"
                            class="block w-full px-3 py-3 bg-transparent text-slate-900 dark:text-white text-sm sm:text-base font-black tracking-widest focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500 placeholder:text-xs placeholder:font-normal placeholder:tracking-normal"
                        />

                        <!-- Nút Xóa Nhanh -->
                        <button 
                            type="button"
                            id="clearInputBtn"
                            onclick="clearPhoneInput()"
                            class="hidden mr-2.5 w-6 h-6 rounded-full bg-rose-500/15 hover:bg-rose-500/25 text-rose-600 dark:text-rose-400 flex items-center justify-center transition-all cursor-pointer shrink-0"
                            title="Xóa nội dung"
                        >
                            <i data-lucide="x" class="w-3.5 h-3.5 stroke-[3]"></i>
                        </button>
                    </div>

                    <!-- Nút Sao Chép Cạnh Ô Nhập -->
                    <button 
                        type="button"
                        onclick="copyInputPhone()"
                        class="px-3.5 py-3 bg-white/80 dark:bg-slate-800/80 hover:bg-white dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-blue-700 dark:text-blue-400 font-extrabold rounded-2xl transition-all active:scale-95 flex items-center justify-center shrink-0 shadow-md cursor-pointer backdrop-blur-sm"
                        title="Sao chép số điện thoại"
                    >
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Nút Tạo -->
            <button 
                type="button"
                onclick="processGenerator()" 
                class="w-full inline-flex items-center justify-center gap-2 px-4 py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-extrabold text-xs sm:text-sm rounded-2xl transition-all shadow-lg shadow-emerald-900/30 cursor-pointer"
            >
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                Tạo Link & Mã QR Zalo
            </button>

            <!-- Khung Loading (0-100%) -->
            <div id="loadingSection" class="hidden bg-white/70 dark:bg-slate-900/70 p-4 rounded-2xl border border-slate-300 dark:border-slate-800 text-center space-y-3 backdrop-blur-md shadow-sm">
                <div class="flex items-center justify-between text-xs font-extrabold text-slate-800 dark:text-slate-200">
                    <span class="flex items-center gap-2">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-600 dark:text-blue-400"></i>
                        Đang khởi tạo hệ thống...
                    </span>
                    <span id="loadingPercent" class="text-blue-600 dark:text-blue-400 font-black">0%</span>
                </div>
                <div class="w-full h-2 bg-slate-200 dark:bg-slate-950 rounded-full overflow-hidden border border-slate-300 dark:border-slate-800">
                    <div id="loadingBar" class="h-full bg-gradient-to-r from-blue-600 to-indigo-600 w-0 transition-all duration-75"></div>
                </div>
            </div>

            <!-- Kết Quả -->
            <div id="resultSection" class="space-y-3 hidden pt-1">
                
                <!-- Phần 1: Link -->
                <div class="bg-white/70 dark:bg-slate-900/70 p-3.5 rounded-2xl space-y-2 border border-slate-300 dark:border-slate-800 shadow-sm backdrop-blur-md">
                    <div class="flex items-center gap-1.5 text-blue-700 dark:text-blue-400 font-extrabold text-xs">
                        <i data-lucide="link" class="w-3.5 h-3.5"></i>
                        <span>Phần 1: Đường Link Zalo</span>
                    </div>
                    
                    <input 
                        type="text" 
                        id="zaloUrl" 
                        readonly 
                        class="block w-full px-3 py-2.5 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-slate-900 dark:text-slate-200 text-xs font-mono font-bold focus:outline-none"
                    />

                    <div class="grid grid-cols-2 gap-2">
                        <button 
                            type="button"
                            onclick="copyLink()" 
                            class="inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-blue-700 dark:text-blue-400 font-extrabold text-xs rounded-xl transition-all border border-slate-300 dark:border-slate-700 active:scale-95 cursor-pointer shadow-sm"
                        >
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            <span id="copyBtnText">Sao chép link</span>
                        </button>
                        
                        <a 
                            id="openZaloBtn"
                            href="#" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="inline-flex items-center justify-center gap-1.5 px-3 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-md active:scale-95 text-center"
                        >
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                            <span>Mở Zalo</span>
                        </a>
                    </div>
                </div>

                <!-- Phần 2: QR -->
                <div class="bg-white/70 dark:bg-slate-900/70 p-3.5 rounded-2xl space-y-2.5 flex flex-col items-center border border-slate-300 dark:border-slate-800 shadow-sm backdrop-blur-md">
                    <div class="w-full flex items-center gap-1.5 text-indigo-700 dark:text-indigo-400 font-extrabold text-xs">
                        <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
                        <span>Phần 2: Mã QR Zalo</span>
                    </div>

                    <div id="qrcode" class="p-3 bg-white rounded-2xl shadow-inner border border-slate-300 flex items-center justify-center overflow-hidden"></div>
                    <p class="text-[11px] font-extrabold text-slate-600 dark:text-slate-400">Mã QR truy cập nhanh</p>

                    <button 
                        type="button"
                        onclick="downloadQR()" 
                        class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white font-extrabold text-xs rounded-xl transition-all active:scale-[0.98] cursor-pointer border border-slate-800 dark:border-slate-700 shadow-sm"
                    >
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Tải mã QR về máy
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-white/50 dark:bg-slate-950/50 border-t border-slate-300 dark:border-slate-800/80 p-2.5 text-center backdrop-blur-md">
            <p class="text-[10px] sm:text-[11px] font-extrabold text-slate-600 dark:text-slate-400">
                Phát triển bởi: <span class="text-blue-600 dark:text-blue-400">Phạm Văn Hoà Programmer 🇻🇳</span>
            </p>
        </div>
    </div>

    <!-- Popup Modal Thông Báo -->
    <div id="errorModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-xs w-full p-5 text-center shadow-2xl animate-modal transition-colors">
            <div class="w-11 h-11 bg-rose-500/15 text-rose-600 dark:text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <i data-lucide="alert-circle" class="w-5 h-5 stroke-[2.5]"></i>
            </div>
            <h3 id="modalTitle" class="text-sm font-extrabold text-slate-900 dark:text-white mb-1">Thông Báo Hệ Thống</h3>
            <p id="modalMessage" class="text-slate-600 dark:text-slate-300 text-xs mb-5 leading-relaxed font-bold"></p>
            <button 
                type="button"
                onclick="closeModal()" 
                class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl transition-all shadow-lg active:scale-95 cursor-pointer"
            >
                Đã hiểu
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Chuyển đổi Sáng / Tối
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.setAttribute('data-lucide', 'moon');
            } else {
                html.classList.add('dark');
                icon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        function handlePhoneInput(input) {
            let cleaned = input.value.replace(/\D/g, '');
            if (cleaned.length > 10) {
                cleaned = cleaned.slice(0, 10);
            }
            input.value = cleaned;

            document.getElementById('charCounter').innerText = `${cleaned.length}/10 số`;

            const clearBtn = document.getElementById('clearInputBtn');
            if (cleaned.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function clearPhoneInput() {
            const input = document.getElementById('phoneInput');
            input.value = '';
            handlePhoneInput(input);
            input.focus();
        }

        function copyInputPhone() {
            const input = document.getElementById('phoneInput');
            const val = input.value.trim();
            if (!val) {
                showModal("Vui lòng nhập số điện thoại trước khi sao chép!");
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                showToast(`Đã sao chép số: ${val}`);
            });
        }

        function processGenerator() {
            const input = document.getElementById('phoneInput');
            const resultSection = document.getElementById('resultSection');
            const loadingSection = document.getElementById('loadingSection');
            const loadingBar = document.getElementById('loadingBar');
            const loadingPercent = document.getElementById('loadingPercent');
            const zaloUrlInput = document.getElementById('zaloUrl');
            const openZaloBtn = document.getElementById('openZaloBtn');

            let cleanDigits = input.value.trim();

            if (cleanDigits.length !== 10) {
                showModal(`Vui lòng nhập chính xác đủ 10 chữ số (hiện tại có ${cleanDigits.length} số).`);
                resultSection.classList.add('hidden');
                return;
            }

            if (!cleanDigits.startsWith('0')) {
                showModal("Số điện thoại di động Việt Nam chuẩn phải bắt đầu bằng chữ số 0.");
                return;
            }

            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);

                    setTimeout(() => {
                        loadingSection.classList.add('hidden');
                        
                        const zaloLink = `https://zalo.me/${cleanDigits}`;
                        zaloUrlInput.value = zaloLink;
                        openZaloBtn.href = zaloLink;

                        generateQRCode(zaloLink);
                        resultSection.classList.remove('hidden');
                        showToast(`Tạo thành công mã QR cho số: ${cleanDigits}`);
                    }, 150);
                }
                loadingBar.style.width = `${progress}%`;
                loadingPercent.innerText = `${progress}%`;
            }, 50);
        }

        function generateQRCode(text) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: text,
                width: 140,
                height: 140,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            const qrImg = document.querySelector('#qrcode img');

            let imageURL = "";
            if (qrCanvas) {
                imageURL = qrCanvas.toDataURL("image/png");
            } else if (qrImg) {
                imageURL = qrImg.src;
            }

            if (imageURL) {
                const link = document.createElement('a');
                link.href = imageURL;
                link.download = 'qr-zalo-pro.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Đã tải xuống mã QR thành công!");
            } else {
                showModal("Không tìm thấy dữ liệu mã QR để tải xuống!");
            }
        }

        function copyLink() {
            const zaloUrl = document.getElementById('zaloUrl');
            zaloUrl.select();
            navigator.clipboard.writeText(zaloUrl.value).then(() => {
                const btnText = document.getElementById('copyBtnText');
                btnText.innerText = "Đã chép!";
                setTimeout(() => btnText.innerText = "Sao chép link", 1500);
                showToast("Đã sao chép đường link vào bộ nhớ tạm!");
            });
        }

        function showModal(message, title = "Thông Báo Hệ Thống") {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('errorModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('errorModal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('successToast');
            document.getElementById('successToastText').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
